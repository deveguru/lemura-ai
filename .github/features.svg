استودیو تصویر و انیمیشن</text><text class="t" x="914" y="190" fill="#c4b5fd" font-size="13.5" text-anchor="start" direction="rtl">تصویر با مدل‌های تصویری، ویدیو با Remotion</text><rect x="336" y="92" width="290" height="132" rx="18" fill="url(#card)" stroke="#a855f7" stroke-opacity=".35"/><rect x="560" y="110" width="48" height="48" rx="14" fill="url(#pur)"/><g transform="translate(572 122) scale(1.0)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" /> <path d="M12 5v14" /></g><text class="t" x="546" y="141" fill="#fff" font-size="18" font-weight="700" text-anchor="start" direction="rtl">منوی + در چت</text><text class="t" x="608" y="190" fill="#c4b5fd" font-size="13.5" text-anchor="start" direction="rtl">فایل، جستجوی وب، حالت خلاقانه و هر ابزار</text><rect x="30" y="92" width="290" height="132" rx="18" fill="url(#card)" stroke="#a855f7" stroke-opacity=".35"/><rect x="254" y="110" width="48" height="48" rx="14" fill="url(#pur)"/><g transform="translate(266 122) scale(1.0)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" /> <path d="M19 10v2a7 7 0 0 1-14 0v-2" /> <line x1="12" x2="12" y1="19" y2="22" /></g><text class="t" x="240" y="141" fill="#fff" font-size="18" font-weight="700" text-anchor="start" direction="rtl">ورودی صوتی</text><text class="t" x="302" y="190" fill="#c4b5fd" font-size="13.5" text-anchor="start" direction="rtl">صحبت کنید؛ به متن تبدیل و ارسال می‌شود</text><rect x="948" y="240" width="290" height="132" rx="18" fill="url(#card)" stroke="#2dd4bf" stroke-opacity=".35"/><rect x="1172" y="258" width="48" height="48" rx="14" fill="url(#teal)"/><g transform="translate(1184 270) scale(1.0)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8" /> <rect width="16" height="12" x="4" y="8" rx="2" /> <path d="M2 14h2" /> <path d="M20 14h2" />