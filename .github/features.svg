d" font-size="13.5" text-anchor="start" direction="rtl">وردپرس، سی‌پنل و SSH با تأیید هر تغییر</text><rect x="336" y="388" width="290" height="132" rx="18" fill="url(#card)" stroke="#a855f7" stroke-opacity=".35"/><rect x="560" y="406" width="48" height="48" rx="14" fill="url(#pur)"/><g transform="translate(572 418) scale(1.0)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 16 4-4-4-4" /> <path d="m6 8-4 4 4 4" /> <path d="m14.5 4-5 16" /></g><text class="t" x="546" y="437" fill="#fff" font-size="18" font-weight="700" text-anchor="start" direction="rtl">دو وب‌سرویس</text><text class="t" x="608" y="486" fill="#c4b5fd" font-size="13.5" text-anchor="start" direction="rtl">هوش مصنوعی + ابزارها، مستندات کامل</text><rect x="30" y="388" width="290" height="132" rx="18" fill="url(#card)" stroke="#a855f7" stroke-opacity=".35"/><rect x="254" y="406" width="48" height="48" rx="14" fill="url(#pur)"/><g transform="translate(266 418) scale(1.0)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1" /> <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4" /></g><text class="t" x="240" y="437" fill="#fff" font-size="18" font-weight="700" text-anchor="start" direction="rtl">کیف پول تومانی</text><text class="t" x="302" y="486" fill="#c4b5fd" font-size="13.5" text-anchor="start" direction="rtl">پرداخت به اندازهٔ مصرف، هزینهٔ هر ابزار</text></svg>
