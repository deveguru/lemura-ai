<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Lemura AI — هوش مصنوعی لمورا">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090611"/><stop offset=".6" stop-color="#140a24"/><stop offset="1" stop-color="#1d0d2b"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/><stop offset=".55" stop-color="#a855f7"/><stop offset="1" stop-color="#f87171"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".55"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f87171" stop-opacity=".35"/><stop offset="1" stop-color="#f87171" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <style>
      .t{font-family:Vazirmatn,Vazir,Tahoma,"Segoe UI",sans-serif}
      .spin{transform-origin:1010px 220px;animation:s 26s linear infinite}
      .spin2{transform-origin:1010px 220px;animation:s 40s linear infinite reverse}
      .pulse{animation:p 3.2s ease-in-out infinite}
      @keyframes s{to{transform:rotate(360deg)}}
      @keyframes p{50%{opacity:.45}}
    </style>
  </defs>
  <rect width="1280" height="440" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="28" fill="url(#grid)"/>
  <circle cx="1010" cy="220" r="260" fill="url(#glow)"/>
  <circle cx="180" cy="400" r="220" fill="url(#glow2)"/>

  <!-- emblem -->
  <g class="spin">
    <circle cx="1010" cy="220" r="150" fill="none" stroke="url(#acc)" stroke-width="2" stroke-dasharray="6 14" opacity=".7"/>
    <circle cx="1160" cy="220" r="7" fill="#f87171"/>
  </g>
  <g class="spin2">
    <circle cx="1010" cy="220" r="112" fill="none" stroke="#a855f7" stroke-opacity=".45" stroke-width="1.5"/>
    <circle cx="1010" cy="108" r="5" fill="#c4b5fd"/>
  </g>
  <g transform="translate(1010 220)">
    <path d="M0-78 68-39V39L0 78-68 39V-39Z" fill="#120a1f" stroke="url(#acc)" stroke-width="3"/>
    <path d="M-26-34V30H28" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="28" cy="-30" r="9" fill="#f87171" class="pulse"/>
  </g>

  <!-- text -->
  <g class="t">
    <text x="72" y="96" fill="#c4b5fd" font-size="20" letter-spacing="4">LEMURA.IR · PERSIAN AI PLATFORM</text>
    <text x="72" y="182" fill="#fff" font-size="76" font-weight="800">Lemura <tspan fill="url(#acc)">AI</tspan></text>
    <text x="72" y="248" fill="#e9d5ff" font-size="40" font-weight="700">هوش مصنوعی لمورا</text>
    <text x="72" y="300" fill="#a78bfa" font-size="21">Chat · Image generation · OpenAI-compatible API · Wallet in Toman</text>
  </g>
  <g class="t" font-size="17" font-weight="700">
    <rect x="72" y="338" width="148" height="44" rx="22" fill="#7c3aed"/>
    <text x="146" y="366" fill="#fff" text-anchor="middle">lemura.ir ↗</text>
    <rect x="234" y="338" width="132" height="44" rx="22" fill="none" stroke="#7c3aed" stroke-opacity=".8"/>
    <text x="300" y="366" fill="#e9d5ff" text-anchor="middle">RTL · Vazir</text>
    <rect x="380" y="338" width="148" height="44" rx="22" fill="none" stroke="#f87171" stroke-opacity=".8"/>
    <text x="454" y="366" fill="#fecaca" text-anchor="middle">Dark mode</text>
  </g>
</svg>
