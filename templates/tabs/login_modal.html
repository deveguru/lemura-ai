<div class="modal-ov" id="loginModal">
  <div class="modal">
    <button class="modal-cls" id="loginClose">✕</button>
    <div style="text-align:center;margin-bottom:8px">
      <div style="font-size:30px;width:54px;height:54px;background:linear-gradient(145deg,#7c3aed,#32165f 65%,#f87171);border-radius:16px;display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--glow)">⚡</div>
      <h2 style="font-size:1.1rem;margin:12px 0 2px">ورود / ثبت‌نام</h2>
      <p style="font-size:.78rem;color:var(--t2);margin:0">روش ورود خود را انتخاب کنید</p>
    </div>
    <div class="lmsg" id="lMsg"></div>
    <div class="ltabs">
      <button class="ltab active" data-ltab="otp">کد پیامکی</button>
      <button class="ltab" data-ltab="pass">رمز عبور</button>
      <button class="ltab" data-ltab="reg">ثبت‌نام</button>
    </div>
    <div data-panel="otp">
      <div id="otpStep1">
        <div class="fg"><label>شماره موبایل</label>
          <input type="tel" class="input ltr" id="otpPhone" maxlength="11" placeholder="09123456789"></div>
        <button class="btn" style="width:100%" id="otpSend">دریافت کد تأیید</button>
      </div>
      <div id="otpStep2" style="display:none">
        <label class="fg" style="margin-bottom:4px">کد تأیید</label>
        <div class="otp-row" id="otpRow"></div>
        <div id="otpNames" style="display:none;gap:8px;flex-direction:column">
          <input type="text" class="input" id="otpFn" placeholder="نام">
          <input type="text" class="input" id="otpLn" placeholder="نام خانوادگی">
        </div>
        <button class="btn" style="width:100%;margin-top:10px" id="otpVerify">تأیید و ورود</button>
        <div id="otpTimer" style="text-align:center;font-size:.78rem;color:var(--t2);margin-top:10px"></div>
        <button class="btn-ghost" style="margin:8px auto 0;display:block;background:none;border:none;cursor:pointer" id="otpBack">تغییر شماره</button>
      </div>
    </div>
    <div data-panel="pass" style="display:none">
      <div class="fg"><label>شماره موبایل یا نام کاربری</label><input class="input ltr" id="passUser" placeholder="09123456789"></div>
      <div class="fg"><label>رمز عبور</label><input type="password" class="input ltr" id="passPw"></div>
      <button class="btn" style="width:100%" id="passBtn">ورود</button>
    </div>
    <div data-panel="reg" style="display:none">
      <div class="fg"><label>شماره موبایل</label><input type="tel" class="input ltr" id="regMobile" maxlength="11" placeholder="09123456789"></div>
      <div class="fg"><label>نام نمایشی</label><input class="input" id="regName" placeholder="نام و نام خانوادگی"></div>
      <div class="fg"><label>رمز عبور</label><input type="password" class="input ltr" id="regPw" placeholder="حداقل ۶ کاراکتر"></div>
      <button class="btn" style="width:100%" id="regBtn">ثبت‌نام</button>
      <div style="text-align:center;margin-top:12px;padding:10px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);border-radius:10px;font-size:.78rem;color:var(--warn)">🎁 هدیه ثبت‌نام به حساب شما اضافه می‌شود</div>
    </div>
  </div>
</div>
